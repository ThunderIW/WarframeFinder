<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How WarframeFinder works</title>
  <desc id="desc">Three steps: choose a Prime part, scan every relic in the WFCD drop tables, and get each relic, refinement and drop chance that contains the part.</desc>

  <rect width="1200" height="300" rx="24" fill="#0e1117"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- step 1 -->
    <g transform="translate(48 48)">
      <rect width="320" height="204" rx="16" fill="#1a1c24" stroke="#2b2e38"/>
      <text x="28" y="48" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#ff4b4b">01</text>
      <text x="28" y="88" font-size="28" font-weight="700" fill="#fafafa">Choose a part</text>
      <rect x="28" y="116" width="264" height="44" rx="10" fill="#262833"/>
      <text x="44" y="145" font-size="20" fill="#d6d8de">Acceltra Prime Receiver</text>
    </g>

    <path d="M384 150 h48 m-10 -10 l10 10 l-10 10" fill="none" stroke="#8b8f9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- step 2 -->
    <g transform="translate(440 48)">
      <rect width="320" height="204" rx="16" fill="#1a1c24" stroke="#2b2e38"/>
      <text x="28" y="48" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#ff4b4b">02</text>
      <text x="28" y="88" font-size="28" font-weight="700" fill="#fafafa">Scan drop tables</text>
      <text x="28" y="134" font-size="20" fill="#d6d8de">Every relic's reward list</text>
      <text x="28" y="166" font-size="20" fill="#d6d8de">from the WFCD drop data</text>
    </g>

    <path d="M776 150 h48 m-10 -10 l10 10 l-10 10" fill="none" stroke="#8b8f9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- step 3 -->
    <g transform="translate(832 48)">
      <rect width="320" height="204" rx="16" fill="#1a1c24" stroke="#2b2e38"/>
      <text x="28" y="48" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#ff4b4b">03</text>
      <text x="28" y="88" font-size="28" font-weight="700" fill="#fafafa">Get relics + odds</text>
      <text x="28" y="134" font-size="20" fill="#d6d8de">Axi O6 Intact</text>
      <rect x="28" y="150" width="200" height="10" rx="5" fill="#2b2e38"/>
      <rect x="28" y="150" width="88" height="10" rx="5" fill="#ff4b4b"/>
      <text x="292" y="161" font-size="20" text-anchor="end" fill="#fafafa">11%</text>
      <text x="28" y="190" font-size="18" fill="#8b8f9c">tier · relic · refinement · rarity</text>
    </g>
  </g>
</svg>
