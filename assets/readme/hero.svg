<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">WarframeFinder</title>
  <desc id="desc">WarframeFinder finds which Void relics drop a Warframe Prime part and the drop chance at every refinement. Example: Acceltra Prime Receiver drops from Axi O6 at 11% Intact, 13% Exceptional, 17% Flawless and 20% Radiant.</desc>

  <rect width="1200" height="400" rx="24" fill="#0e1117"/>

  <!-- title block -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="112" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8b8f9c">PRIME PART <tspan fill="#ff4b4b">→</tspan> VOID RELIC</text>
    <text x="60" y="190" font-size="70" font-weight="700" fill="#fafafa" letter-spacing="-1">WarframeFinder</text>
    <text x="64" y="246" font-size="26" fill="#d6d8de">Pick a Prime part. See which Void relics</text>
    <text x="64" y="282" font-size="26" fill="#d6d8de">drop it, and the odds at every refinement.</text>
    <text x="64" y="336" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#8b8f9c">Python · WFCD drop tables · live data</text>
  </g>

  <!-- real lookup result -->
  <g id="project-proof" transform="translate(700 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="436" height="304" rx="16" fill="#1a1c24" stroke="#2b2e38"/>

    <rect x="24" y="24" width="388" height="48" rx="10" fill="#262833"/>
    <text x="42" y="56" font-size="20" fill="#fafafa">Acceltra Prime Receiver</text>
    <path d="M384 44 l8 8 l8 -8" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="24" y="112" font-size="20" font-weight="600" fill="#fafafa">Axi O6 <tspan font-weight="400" fill="#8b8f9c">· Uncommon</tspan></text>

    <g id="chance-bars" font-size="20">
      <!-- bar width = chance / 25% × 170 -->
      <g transform="translate(24 150)">
        <text y="7" fill="#d6d8de">Intact</text>
        <rect x="150" y="-6" width="170" height="10" rx="5" fill="#2b2e38"/>
        <rect x="150" y="-6" width="74.8" height="10" rx="5" fill="#ff4b4b"/>
        <text x="388" y="7" text-anchor="end" fill="#fafafa">11%</text>
      </g>
      <g transform="translate(24 194)">
        <text y="7" fill="#d6d8de">Exceptional</text>
        <rect x="150" y="-6" width="170" height="10" rx="5" fill="#2b2e38"/>
        <rect x="150" y="-6" width="88.4" height="10" rx="5" fill="#ff4b4b"/>
        <text x="388" y="7" text-anchor="end" fill="#fafafa">13%</text>
      </g>
      <g transform="translate(24 238)">
        <text y="7" fill="#d6d8de">Flawless</text>
        <rect x="150" y="-6" width="170" height="10" rx="5" fill="#2b2e38"/>
        <rect x="150" y="-6" width="115.6" height="10" rx="5" fill="#ff4b4b"/>
        <text x="388" y="7" text-anchor="end" fill="#fafafa">17%</text>
      </g>
      <g transform="translate(24 282)">
        <text y="7" fill="#d6d8de">Radiant</text>
        <rect x="150" y="-6" width="170" height="10" rx="5" fill="#2b2e38"/>
        <rect x="150" y="-6" width="136" height="10" rx="5" fill="#ff4b4b"/>
        <text x="388" y="7" text-anchor="end" fill="#fafafa">20%</text>
      </g>
    </g>
  </g>
</svg>
